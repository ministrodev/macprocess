name: Build & Release MacProcess

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da Release (ex: 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Determinar Versão
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Versão definida: ${VERSION}"

      - name: Configurar Ambiente de Build
        run: |
          brew install cmake
          pip3 install --break-system-packages dmgbuild biplist || pip3 install dmgbuild biplist

      - name: Compilar MacProcess (.app Universal macOS 12+) e Gerar Instalador (.dmg)
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          # 1. Compilar Backend C++ Universal (macOS 12.0+ ARM64 e x86_64)
          cmake -S Backend -B Backend/build \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build Backend/build
          
          # 2. Compilar Swift App Universal (macOS 12.0+ ARM64 + x86_64)
          swift build -c release --arch arm64 --arch x86_64
          
          # Localizar o binário compilado
          SWIFT_BIN=""
          if [ -f ".build/apple/Products/Release/MacProcess" ]; then
            SWIFT_BIN=".build/apple/Products/Release/MacProcess"
          elif [ -f ".build/release/MacProcess" ]; then
            SWIFT_BIN=".build/release/MacProcess"
          else
            SWIFT_BIN=$(find .build -name MacProcess -type f -perm +111 | head -n 1)
          fi
          
          # 3. Montar Bundle MacProcess.app
          rm -rf MacProcess.app
          mkdir -p MacProcess.app/Contents/MacOS
          mkdir -p MacProcess.app/Contents/Resources
          
          cp "$SWIFT_BIN" MacProcess.app/Contents/MacOS/MacProcess
          cp Backend/build/process-backend MacProcess.app/Contents/MacOS/process-backend
          cp Assets.xcassets/AppIcon.icns MacProcess.app/Contents/Resources/AppIcon.icns
          
          cat << 'PLIST' > MacProcess.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MacProcess</string>
              <key>CFBundleIdentifier</key>
              <string>com.ministrodev.macprocess</string>
              <key>CFBundleName</key>
              <string>MacProcess</string>
              <key>CFBundleDisplayName</key>
              <string>MacProcess</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          
          # 4. Assinar Bundle com assinatura Ad-Hoc para validação no macOS
          codesign --force --deep --sign - MacProcess.app
          
          # 5. Criar Instalador .dmg Personalizado usando dmgbuild
          DMG_NAME="MacProcess-${VERSION}.dmg"
          rm -f "$DMG_NAME"
          
          dmgbuild -s dmgbuild_settings.py "MacProcess" "$DMG_NAME" || true
          
          # Fallback de segurança se dmgbuild falhar
          if [ ! -f "$DMG_NAME" ]; then
            echo "Fallback hdiutil create..."
            hdiutil create -volname "MacProcess" -srcfolder "MacProcess.app" -ov -format UDZO "$DMG_NAME"
          fi

      - name: Salvar Artefato do Instalador (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: MacProcess-${{ steps.get_version.outputs.VERSION }}-DMG
          path: MacProcess-${{ steps.get_version.outputs.VERSION }}.dmg
          if-no-files-found: error

      - name: Publicar GitHub Release (em Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MacProcess-${{ steps.get_version.outputs.VERSION }}.dmg
          name: "MacProcess v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
